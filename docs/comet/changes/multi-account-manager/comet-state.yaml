acceptance:
  - id: A1
    source: brief.md
    text: "[ ] AC-1 (账号容量与展示)：客户端能创建并列出至少 8 个独立账号，主界面左侧/左下角 Dock
      栏能正常排布并完整展示各账号徽章与备注。"
    result: passed
    reason:
      text: 已实现多账号列表与滚动Dock布局，可支持8+账号
      truncated: false
  - id: A2
    source: brief.md
    text: "[ ] AC-2 (会话隔离)：在账号 A 登录 Muse 后，切换至账号 B 呈现未登录状态，登录账号 B 后切换回账号 A，账号 A
      仍保持登录态，互不串号。"
    result: passed
    reason:
      text: 采用独立persist:muse-${profileId}分区，Cookie及存储完全隔离
      truncated: false
  - id: A3
    source: brief.md
    text: "[ ] AC-3 (一键秒切)：点击 Dock 栏任意账号徽章，主窗口平滑切换至目标账号会话并刷新当前页面，当前活跃徽章状态高亮更新。"
    result: passed
    reason:
      text: 点击Dock徽章平滑切换活跃会话并刷新界面
      truncated: false
  - id: A4
    source: brief.md
    text: "[ ] AC-4 (新增账号)：点击 Dock 栏「+」按钮，支持创建新账号并自动切换至该空白会话供新用户登录。"
    result: passed
    reason:
      text: 点击+按钮创建新账号并立即激活供家人登录
      truncated: false
  - id: A5
    source: brief.md
    text: "[ ] AC-5 (账号重命名)：支持对已有账号修改备注昵称（如“工作”、“家人1”），修改后 Dock 栏、Tooltip
      及托盘菜单即时同步更新。"
    result: passed
    reason:
      text: 支持自定义备注，Dock、Tooltip与托盘即时同步
      truncated: false
  - id: A6
    source: brief.md
    text: "[ ] AC-6 (独立登出与删除)：支持对当前账号执行独立退出登录（仅清除该 Profile 的 Cookie
      与本地缓存），支持删除非活跃账号（且至少保留 1 个基础账号）。"
    result: passed
    reason:
      text: 独立登出单账号清除存储，支持删除保留至少1个账号
      truncated: false
  - id: A7
    source: brief.md
    text: "[ ] AC-7 (快捷键轮巡)：使用快捷键（Ctrl+Shift+N）时能够顺次循环切换至下一个账号并触发主窗口更新与提示。"
    result: passed
    reason:
      text: Ctrl+Shift+N绑定通用switchNextAccount并给出提示
      truncated: false
  - id: A8
    source: brief.md
    text: "[ ] AC-8 (Dock 栏折叠与视觉融合)：Dock 栏具备折叠/展开机制，设计风格与 Muse
      深色原生界面融为一体，不干扰原有网页元素点击。"
    result: passed
    reason:
      text: Dock栏深色毛玻璃设计，支持展开收起与状态持久化
      truncated: false
  - id: A9
    source: specs/multi-account/spec.md
    text: Switching accounts - **WHEN** the user clicks an account avatar in the
      dock or uses the global hotkey - **THEN** the system switches to that
      account session partition and reloads the active window
    result: passed
    reason:
      text: "Spec: 账号切换行为符合规范"
      truncated: false
  - id: A10
    source: specs/multi-account/spec.md
    text: Adding accounts - **WHEN** the user clicks the add account button (`+`) -
      **THEN** the system creates a new account profile and switches to it for
      fresh login
    result: passed
    reason:
      text: "Spec: 新建账号流程符合规范"
      truncated: false
  - id: A11
    source: specs/multi-account/spec.md
    text: Renaming accounts - **WHEN** the user renames an existing account -
      **THEN** the system persists the custom name and updates the dock,
      tooltip, and tray menu
    result: passed
    reason:
      text: "Spec: 账号重命名流程符合规范"
      truncated: false
  - id: A12
    source: specs/multi-account/spec.md
    text: Signing out of single account - **WHEN** the user signs out of a specific
      account - **THEN** the system clears that account's session storage
      without affecting any other account sessions
    result: passed
    reason:
      text: "Spec: 单账号登出流程符合规范"
      truncated: false
  - id: A13
    source: specs/multi-account/spec.md
    text: Deleting account - **WHEN** the user deletes a non-active account -
      **THEN** the system removes the profile while preserving at least one
      remaining account
    result: passed
    reason:
      text: "Spec: 账号删除与保底策略符合规范"
      truncated: false
