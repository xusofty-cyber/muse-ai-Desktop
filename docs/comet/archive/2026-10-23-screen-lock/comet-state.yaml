acceptance:
  - id: A1
    source: brief.md
    text: "**AC-1 (密码设置与高强度加密)**：首次启用锁屏密码需确认输入两次一致密码，经 `scrypt` 加盐哈希后安全写入
      `app-state.json`，文件中绝无明文或弱 MD5/SHA 密码。"
    result: passed
    reason:
      text: scrypt加盐哈希算法生成 16 字节随机 salt 与 64 字节密钥，app-state.json 中绝无明文或弱散列，自动化测试 PASS
      truncated: false
  - id: A2
    source: brief.md
    text: "**AC-2 (密码修改校验)**：已设置密码时，修改密码必须提供旧密码并校验通过，旧密码错误时拒绝更新。"
    result: passed
    reason:
      text: lock:change-password 强制校验旧密码，不匹配时拒绝修改，自动化测试 PASS
      truncated: false
  - id: A3
    source: brief.md
    text: "**AC-3 (手动与快捷键即刻锁屏)**：按下 `Ctrl+Shift+L`
      或在托盘菜单点击“锁定客户端”或设置页点击“立即锁屏”，所有会话窗口立刻隐匿并弹出锁屏窗口。"
    result: passed
    reason:
      text: 支持全局快捷键 CommandOrControl+Shift+L、托盘菜单与设置页立即锁屏三入口即刻隐匿会话并拉起锁屏
      truncated: false
  - id: A4
    source: brief.md
    text: "**AC-4 (定时空闲自动锁屏)**：开启定时锁屏并配置时长（例如 1 分钟/5 分钟），系统无操作达到设定时长后自动触发锁屏。"
    result: passed
    reason:
      text: 定时空闲自动锁屏逻辑与 1/5/15/30/60 分钟范围合法性校验通过，超时自动触发锁屏
      truncated: false
  - id: A5
    source: brief.md
    text: "**AC-5
      (锁定态越权拦截)**：锁屏状态下，按快捷键切换账号（Ctrl+Shift+N）、打开设置或快速对话均被拦截，托盘仅允许解锁或退出，无法窥视任何会\
      话。"
    result: passed
    reason:
      text: 锁屏状态下账号切换、设置、快速对话等关键操作被全量拦截，无法窥探会话数据
      truncated: false
  - id: A6
    source: brief.md
    text: "**AC-6 (解锁恢复与防暴力破解)**：输入正确密码后立即关闭锁屏窗并恢复原有账号会话；连续输错 5
      次后提示冷却倒计时并暂时禁用解锁，阻断暴力破解。"
    result: passed
    reason:
      text: 输入正确密码立即恢复会话；连续输错 5 次触发 30 秒冷却倒计时并拒绝对比，阻断暴力破解
      truncated: false
  - id: A7
    source: specs/screen-lock/spec.md
    text: "Setting initial password - **WHEN** the user enables screen lock and
      provides a new password with confirmation - **THEN** the system generates
      a 16-byte random salt, computes the `scrypt` hash (64-byte key), and
      persists `{ enabled: true, hash, salt }` in state without storing
      plaintext"
    result: passed
    reason:
      text: 初始密码设置生成独立随机 salt 与 scrypt hash，存储契约安全合规
      truncated: false
  - id: A8
    source: specs/screen-lock/spec.md
    text: Changing existing password - **WHEN** the user requests a password change
      - **THEN** the system requires verification of the current password using
      constant-time comparison (`crypto.timingSafeEqual`), rejecting the update
      if incorrect
    result: passed
    reason:
      text: 密码验证使用 crypto.timingSafeEqual 并在长度不匹配时安全返回，防时序侧信道攻击
      truncated: false
  - id: A9
    source: specs/screen-lock/spec.md
    text: Brute-force protection - **WHEN** an incorrect password is submitted 5
      consecutive times - **THEN** the system temporarily locks input for 30
      seconds, displaying a countdown timer and rejecting attempts during the
      lockout window ---
    result: passed
    reason:
      text: 5 次失败触发 30 秒锁定窗口，lock.html 倒计时与主进程校验一致
      truncated: false
  - id: A10
    source: specs/screen-lock/spec.md
    text: Global hotkey trigger - **WHEN** the user presses the lock screen global
      hotkey (default `CommandOrControl+Shift+L`) - **THEN** the system
      immediately transitions to locked state and conceals all chat windows
    result: passed
    reason:
      text: CommandOrControl+Shift+L 注册成功，触发时 hide 所有窗口并展示 lockWindow
      truncated: false
  - id: A11
    source: specs/screen-lock/spec.md
    text: System tray menu trigger - **WHEN** the user selects "🔒 锁定客户端" from the
      system tray menu - **THEN** the system immediately locks the interface and
      displays the unlock modal
    result: passed
    reason:
      text: 托盘菜单动态切换：未锁时显示“锁定客户端”，锁定后仅允许解锁或退出
      truncated: false
  - id: A12
    source: specs/screen-lock/spec.md
    text: Settings button trigger - **WHEN** the user clicks "立即锁屏" in the Security
      settings panel - **THEN** the system immediately locks the application ---
    result: passed
    reason:
      text: hotkeys.html 包含立即锁屏按钮，点击立即调用 lockAPI.lockNow()
      truncated: false
  - id: A13
    source: specs/screen-lock/spec.md
    text: "Inactivity threshold reached - **WHEN** auto-lock is enabled and
      system/in-app idle time exceeds the configured duration (`idleMinutes`: 1,
      5, 15, 30, or 60 min) - **THEN** the system automatically transitions into
      locked state without user intervention"
    result: passed
    reason:
      text: powerMonitor.getSystemIdleTime 结合应用内活动时间，达到阈值自动锁屏
      truncated: false
  - id: A14
    source: specs/screen-lock/spec.md
    text: Activity resets timer - **WHEN** user interaction occurs before the
      threshold is reached - **THEN** the inactivity timer resets, preventing
      premature lock ---
    result: passed
    reason:
      text: 窗口聚焦与操作触发 recordUserActivity，重置最后活动时间防误锁
      truncated: false
  - id: A15
    source: specs/screen-lock/spec.md
    text: Window concealment - **WHEN** the application is locked - **THEN** all
      profile windows, main window, and quick chat window are hidden or
      occluded, and a dedicated lock screen window (`lock.html`) is displayed
    result: passed
    reason:
      text: 锁屏时全量隐藏 mainWindow、profileWindows、hotkeyWindow、quickWindow，弹出 lockWindow
      truncated: false
  - id: A16
    source: specs/screen-lock/spec.md
    text: Shortcut suppression - **WHEN** the application is locked - **THEN**
      hotkeys for switching accounts, toggling sites, opening quick chat, or
      accessing settings are blocked
    result: passed
    reason:
      text: isScreenLocked 守卫所有快捷键与切换逻辑，越权调用直接拦截
      truncated: false
  - id: A17
    source: specs/screen-lock/spec.md
    text: Unlocking - **WHEN** the user inputs the correct password into the lock
      screen - **THEN** the system closes the lock window, unblocks shortcuts,
      and restores visibility and focus to the active profile window ---
    result: passed
    reason:
      text: 正确密码销毁 lockWindow，恢复活动账号窗口聚焦与托盘菜单
      truncated: false
  - id: A18
    source: specs/screen-lock/spec.md
    text: Managing lock configuration - **WHEN** the user navigates to the Security
      tab in `hotkeys.html` - **THEN** the user can toggle password lock,
      set/modify passwords, toggle auto-lock, choose timeout durations, and view
      the current lock hotkey
    result: passed
    reason:
      text: hotkeys.html 新增 Security 标签页，支持主密码开关、修改、自动锁屏时间配置及快捷键查看，中英文语言无缝切换
      truncated: false
