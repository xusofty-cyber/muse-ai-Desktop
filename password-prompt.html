<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Muse</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 22px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #1b1e25; color: #e5e7eb; font-size: 13px; user-select: none; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 0 0 14px; color: #9aa3b2; line-height: 1.5; font-size: 12px; }
  input { width: 100%; padding: 8px 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #2d323e;
          background: #12141a; color: #e5e7eb; font-size: 13px; outline: none; }
  input:focus { border-color: #3b82f6; }
  .err { color: #ff9a9a; min-height: 16px; font-size: 12px; margin-bottom: 8px; }
  .row { display: flex; justify-content: flex-end; gap: 8px; }
  button { padding: 7px 16px; border-radius: 6px; border: 1px solid #2d323e; background: #262a33; color: #e5e7eb; cursor: pointer; font-size: 12.5px; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="message"></p>
  <input type="password" id="pwd" autocomplete="new-password" autofocus>
  <input type="password" id="pwd2" autocomplete="new-password" style="display:none">
  <div class="err" id="err"></div>
  <div class="row">
    <button type="button" id="cancel"></button>
    <button type="button" class="primary" id="ok"></button>
  </div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const opts = (await window.promptAPI.getOptions()) || {};
  const zh = opts.locale !== 'en';
  const minLength = opts.minLength || 0;
  $('title').textContent = opts.title || (zh ? '输入密码' : 'Enter password');
  $('message').textContent = opts.message || '';
  $('pwd').placeholder = zh ? '密码' : 'Password';
  $('pwd2').placeholder = zh ? '再次输入密码' : 'Confirm password';
  $('ok').textContent = zh ? '确定' : 'OK';
  $('cancel').textContent = zh ? '取消' : 'Cancel';
  if (opts.confirm) $('pwd2').style.display = '';

  const submit = () => {
    const v = $('pwd').value;
    if (!v) { $('err').textContent = zh ? '请输入密码' : 'Password is required'; return; }
    if (v.length < minLength) { $('err').textContent = zh ? `密码至少 ${minLength} 位` : `At least ${minLength} characters`; return; }
    if (opts.confirm && v !== $('pwd2').value) { $('err').textContent = zh ? '两次输入的密码不一致' : 'Passwords do not match'; return; }
    window.promptAPI.submit(v);
  };
  $('ok').onclick = submit;
  $('cancel').onclick = () => window.promptAPI.cancel();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') window.promptAPI.cancel();
  });
  $('pwd').focus();
})();
</script>
</body>
</html>
