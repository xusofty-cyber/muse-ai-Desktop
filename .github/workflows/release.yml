name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Windows 打包发布 (NSIS 安装包 + Portable 便携单文件)
      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux 打包发布 (AppImage + DEB + tar.gz)
      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb tar.gz --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS 图标修复: 仓库 icon.png 仅 256x256, electron-builder 生成 .icns
      # 要求源图至少 512x512, mac 任务此前连续多版无产物疑与此有关。
      # 构建前用 macOS 自带 sips 放大到 1024x1024 (源图替换为 1024 后此步无害)。
      - name: Prepare macOS icon (>=512px for icns)
        if: matrix.os == 'macos-latest'
        run: sips -z 1024 1024 assets/icon.png

      # macOS 打包发布 (DMG + ZIP)
      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
