name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 发版防呆: tag 必须等于 v<package.json version>, 不一致直接失败,
      # 避免打出 v1.5.16 的 tag 却装着 1.5.15 的包 (评审 P1-7)
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VERSION}"
            exit 1
          fi
          echo "Tag matches package.json version v${PKG_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Windows 打包发布 (NSIS 安装包 + Portable 便携单文件)
      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux 打包发布 (AppImage + DEB + tar.gz)
      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb tar.gz --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS 图标修复: 仓库 icon.png 仅 256x256, electron-builder 生成 .icns
      # 要求源图至少 512x512, mac 任务此前连续多版无产物疑与此有关。
      # 构建前用 macOS 自带 sips 放大到 1024x1024 (源图替换为 1024 后此步无害)。
      - name: Prepare macOS icon (>=512px for icns)
        if: matrix.os == 'macos-latest'
        run: sips -z 1024 1024 assets/icon.png

      # macOS 打包发布 (DMG + ZIP)
      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # 三端构建全部成功后, 把草稿 Release 转为正式发布 (配合 package.json 的
  # releaseType: draft)。任何一端失败, Release 保持草稿, 用户下不到半成品。
  finalize:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
